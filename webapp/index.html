<title>BirdNET-Go Validation Candidates</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #eef2f1;
    --surface: #ffffff;
    --fg: #172321;
    --muted: #5b6b68;
    --border: #d7e0de;
    --row-alt: #f5f8f7;

    --confirm-fg: #1f6b45;
    --disagree-bg: #f7e1da;

    --nodet-bg: #e4e9e7;
    --nodet-fg: #5b6b68;
    --accent: #3c6e78;
    --accent-fg: #ffffff;
    --accept-bg: #2f7d4f;

  }

      --surface: #182220;
      --fg: #e7ede9;

    margin: 0;

    background: var(--bg);
    color: var(--fg);
    padding: 20px;
  }

  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  input[type=text] {

  }

  label.compact {

    align-items: center;

  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 780px; }
  th, td {

    border-bottom: 1px solid var(--border);

  }
  th {

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }

  th:nth-child(1), td:nth-child(1),
  th:nth-child(2), td:nth-child(2),
  th:nth-child(3), td:nth-child(3) {

  }
  th:nth-child(1), td:nth-child(1) { left: 0; width: 32px; min-width: 32px; max-width: 32px; text-align: center; }
  th:nth-child(2), td:nth-child(2) { left: 32px; width: 60px; min-width: 60px; max-width: 60px; overflow: hidden; }
  th:nth-child(3), td:nth-child(3) { left: 92px; box-shadow: 2px 0 4px -2px rgba(0, 0, 0, 0.25); }
  th:nth-child(1), th:nth-child(2), th:nth-child(3) { z-index: 3; }
  td:nth-child(1), td:nth-child(2), td:nth-child(3) { z-index: 1; }
  tbody tr:nth-child(even) td:nth-child(1), tbody tr:nth-child(even) td:nth-child(2), tbody tr:nth-child(even) td:nth-child(3) { background: var(--row-alt); }
  tbody tr:hover td:nth-child(1), tbody tr:hover td:nth-child(2), tbody tr:hover td:nth-child(3) { background: var(--row-hover); }
  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    font-family: var(--font-mono);

    cursor: default;
  }
  .pill.confirm { background: var(--confirm-bg); color: var(--confirm-fg); }
  .pill.disagree { background: var(--disagree-bg); color: var(--disagree-fg); }
  .pill.no_detection { background: var(--nodet-bg); color: var(--nodet-fg); }
  .pill.not_run { background: transparent; color: var(--muted); font-weight: 400; }
  select#day {

    color: var(--fg);

    thead { display: none; }

    tbody tr {

    /* card header: checkbox, verdict pill, species, play button */
    td:nth-child(1) { order: 1; }
    td:nth-child(2) { order: 2; }

<h1>BirdNET-Go Validation Candidates</h1>
<div class="subtitle" id="subtitle">Loading…</div>

<div class="toolbar toolbar-controls">
  <button id="menu-btn" class="icon-btn" type="button" title="Menu" aria-label="Menu">☰</button>
  <select id="day"></select>
  <button id="search-btn" class="icon-btn" type="button" title="Search &amp; filter" aria-label="Search &amp; filter">🔍</button>
  <button id="refresh-btn">↻ Refresh</button>
  <span id="run-status"></span>

  <div id="menu-panel" class="dropdown-panel">
    <label class="force-check"><input type="checkbox" id="all-days"> show all days</label>
    <button id="run-btn">Run birda ▶</button>
    <label class="force-check"><input type="checkbox" id="force"> re-run cached</label>
    <label class="force-check">rarity min 1&ndash;max <input type="number" id="rare-max" value="5" min="1" step="1" class="param"></label>
    <label class="force-check">confirm ≥ <input type="number" id="confirm-threshold" value="0.8" min="0" max="1" step="0.01" class="param"></label>
    <label class="compact"><input type="checkbox" id="compact"> Compact view</label>

      <div class="tab active" data-filter="all">All <span class="count" id="count-all"></span></div>

  <div class="toolbar-actions-buttons">
    <button id="accept-btn" class="bulk-action btn-accept" disabled>✓ Accept</button>

    </div>

<script>
let allData = [];
let sortKey = "species";
let sortDir = 1;
let activeFilter = "all";
let selectedIds = new Set();
let lastVisibleRows = [];
let birdnetgoWebUrl = "";

const PILL_LETTER = { confirm: "C", disagree: "D", no_detection: "N", not_run: "–" };
const PILL_TITLE = { confirm: "Confirm", disagree: "Disagree", no_detection: "No detection", not_run: "Not run" };

function pill(verdict) {
  const letter = PILL_LETTER[verdict] || "?";
  const title = PILL_TITLE[verdict] || verdict;
  return `<span class="pill ${verdict}" title="${title}">${letter}</span>`;
}

function model2Cell(v, label) {
  const detail = v.top_species
    ? `<span class="model2-sci">${v.top_species}</span><span class="model2-common">${v.top_common_name || ""}</span>`
    : "";
  return `<td class="model2-cell" data-label="${label}">${pill(v.verdict)} <span class="sub">${fmtConf(v.top_confidence)}</span>${detail}</td>`;
}

function fmtConf(c) {
  return c === null || c === undefined ? "—" : c.toFixed(2);
}

function getConfirmThreshold() {
  const v = parseFloat(document.getElementById("confirm-threshold").value);
  return Number.isFinite(v) ? v : 0.8;
}

function getRarityParams() {
  const max = document.getElementById("rare-max").value;
  return new URLSearchParams({ rare_min: 1, rare_max: max });
}

function recomputeModelVerdict(v, originalSpecies, threshold) {
  if (v.verdict === "not_run") return v;
  let verdict;
  if (v.top_species === null) verdict = "no_detection";
  else if (v.top_species === originalSpecies && v.top_confidence >= threshold) verdict = "confirm";
  else verdict = "disagree";
  return { ...v, verdict };
}

function withThreshold(r, threshold) {
  const bn = recomputeModelVerdict(r.verify_birdnet_v24, r.species, threshold);
  const pc = recomputeModelVerdict(r.verify_perch_v2, r.species, threshold);
  const bothRan = bn.verdict !== "not_run" && pc.verdict !== "not_run";
  const modelsDisagree = bothRan && bn.top_species && pc.top_species && bn.top_species !== pc.top_species;
  let overall;
  if (bn.verdict === "not_run") overall = "not_run";
  else if (modelsDisagree) overall = "disagree";
  else if (bn.verdict === "confirm" || pc.verdict === "confirm") overall = "confirm";
  else if (bn.verdict === "no_detection" && pc.verdict === "no_detection") overall = "no_detection";
  else overall = "disagree";
  return { ...r, verify_birdnet_v24: bn, verify_perch_v2: pc, overall_verdict: overall };
}

function enforceDayScope() {
  if (document.getElementById("all-days").checked) return;
  const selectedDay = document.getElementById("day").value;
  selectedIds.forEach(id => {
    const rec = allData.find(r => r.detection_id === id);
    if (!rec || !rec.detected_at_local.startsWith(selectedDay)) selectedIds.delete(id);
  });
}

function scopedData() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const showAllDays = document.getElementById("all-days").checked;
  const selectedDay = document.getElementById("day").value;
  const threshold = getConfirmThreshold();
  return allData.filter(r => {
    if (!showAllDays && selectedDay && !r.detected_at_local.startsWith(selectedDay)) return false;
    if (!q) return true;
    return r.species.toLowerCase().includes(q) || r.common_name.toLowerCase().includes(q) || String(r.detection_id).includes(q);
  }).map(r => withThreshold(r, threshold));
}

function render() {
  const scoped = scopedData();
  updateCounts(scoped);
  let rows = scoped.filter(r => activeFilter === "all" || r.overall_verdict === activeFilter);

  rows.sort((a, b) => {
    let va, vb;
    if (sortKey === "species") { va = a.common_name; vb = b.common_name; }
    else if (sortKey === "bn_verdict") { va = a.verify_birdnet_v24.verdict; vb = b.verify_birdnet_v24.verdict; }
    else if (sortKey === "pc_verdict") { va = a.verify_perch_v2.verdict; vb = b.verify_perch_v2.verdict; }
    else if (sortKey === "model") { va = a.model; vb = b.model; }
    else if (sortKey === "confidence") { va = a.confidence; vb = b.confidence; }
    else { va = a[sortKey]; vb = b[sortKey]; }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById("rows");
  tbody.innerHTML = rows.map(r => {
    const bn = r.verify_birdnet_v24, pc = r.verify_perch_v2;
    const clipAttr = r.clip_name ? `data-clip="${r.clip_name}" data-label="${r.common_name} #${r.detection_id}" data-id="${r.detection_id}"` : "";
    const sciLine = r.common_name !== r.species ? `<span class="species-sci">${r.species}</span>` : "";
    const reviewUrl = `${birdnetgoWebUrl}/ui/detections/${r.detection_id}?tab=review`;
    return `<tr class="${r.clip_exists ? "" : "no-clip"}" data-verdict="${r.overall_verdict}">
      <td data-label="Select"><input type="checkbox" class="row-select" data-id="${r.detection_id}" ${selectedIds.has(r.detection_id) ? "checked" : ""}></td>
      <td data-label="Overall">${pill(r.overall_verdict)}</td>
      <td class="species-cell" data-label="Species"><a class="species-link" href="${reviewUrl}" target="_blank" rel="noopener"><span class="species-common">${r.common_name}</span>${sciLine}</a></td>
      <td data-label="ID" class="mono">${r.detection_id}</td>
      <td data-label="Date/time" class="mono">${r.detected_at_local.slice(0, 16).replace("T", " ")}</td>
      <td data-label="Orig. model">${r.model}</td>
      <td data-label="Orig. conf." class="mono">${fmtConf(r.confidence)}</td>
      ${model2Cell(bn, "BirdNET (2nd)")}
      ${model2Cell(pc, "Perch (2nd)")}
      <td data-label="Noted" title="${r.note_posted ? "birda result posted to BirdNET-Go" : "no comment posted yet"}">${r.note_posted ? "📝" : "—"}</td>
      <td data-label="Play">${r.clip_exists ? `<button class="play" ${clipAttr}>▶</button>` : "—"}</td>
    </tr>`;
  }).join("");

  document.getElementById("subtitle").textContent =
    `Showing ${rows.length} of ${scoped.length} candidates` +
    (document.getElementById("all-days").checked ? " (all days)" : ` for ${document.getElementById("day").value}`);

  lastVisibleRows = rows;
  updateSelectionUI(rows);
}

function updateSelectionUI(visibleRows) {
  const count = selectedIds.size;
  document.getElementById("selection-count").textContent =
    count === 0 ? "No detections selected" : `${count} selected`;
  document.getElementById("accept-btn").disabled = count === 0;
  document.getElementById("false-positive-btn").disabled = count === 0;
  document.getElementById("player-accept-btn").disabled = count === 0;
  document.getElementById("player-false-positive-btn").disabled = count === 0;

  const selectAll = document.getElementById("select-all");
  const selectAllMobile = document.getElementById("select-all-mobile");
  if (visibleRows.length === 0) {
    selectAll.checked = false;
    selectAll.indeterminate = false;
  } else {
    const selectedVisible = visibleRows.filter(r => selectedIds.has(r.detection_id)).length;
    selectAll.checked = selectedVisible === visibleRows.length;
    selectAll.indeterminate = selectedVisible > 0 && selectedVisible < visibleRows.length;
  }
  selectAllMobile.checked = selectAll.checked;
  selectAllMobile.indeterminate = selectAll.indeterminate;
}

function updateCounts(scoped) {
  const counts = { all: scoped.length, confirm: 0, disagree: 0, no_detection: 0, not_run: 0 };
  scoped.forEach(r => counts[r.overall_verdict] = (counts[r.overall_verdict] || 0) + 1);
  for (const k of ["all", "confirm", "disagree", "no_detection", "not_run"]) {
    document.getElementById(`count-${k}`).textContent = `(${counts[k] || 0})`;
  }
}

function loadDays(selectDay) {
  return fetch("/api/days?" + getRarityParams()).then(r => r.json()).then(days => {
    const sel = document.getElementById("day");
    const prev = selectDay || sel.value;
    sel.innerHTML = days.map(d =>
      `<option value="${d.day}">${d.day} — ${d.with_clip} candidate(s), ${d.verified} verified</option>`
    ).join("");
    if (prev && days.some(d => d.day === prev)) sel.value = prev;
  });
}

function loadCandidates() {
  return fetch("/api/candidates?" + getRarityParams()).then(r => r.json()).then(data => {
    allData = data;
    const stillPresent = new Set(data.map(r => r.detection_id));
    selectedIds.forEach(id => { if (!stillPresent.has(id)) selectedIds.delete(id); });
    render();
  });
}

function loadConfig() {
  return fetch("/api/config").then(r => r.json()).then(cfg => {
    birdnetgoWebUrl = cfg.birdnetgo_web_url || "";
  });
}

document.getElementById("run-btn").addEventListener("click", () => {
  const day = document.getElementById("day").value;
  const force = document.getElementById("force").checked;
  if (!day) return;
  const btn = document.getElementById("run-btn");
  const status = document.getElementById("run-status");
  btn.disabled = true;
  status.textContent = `Running birda on ${day}…`;
  fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      day, force,
      confirm_threshold: getConfirmThreshold(),
      rare_min: 1,
      rare_max: document.getElementById("rare-max").value,
    }),
  })
    .then(r => r.json())
    .then(resp => {
      if (resp.error) {
        status.textContent = "Error: " + resp.error;
        return;
      }
      status.textContent = `Done: ran ${resp.ran}, skipped ${resp.skipped_cached} already cached.`;
      return Promise.all([loadCandidates(), loadDays(day)]);
    })
    .catch(err => { status.textContent = "Error: " + err; })
    .finally(() => { btn.disabled = false; });
});

document.getElementById("refresh-btn").addEventListener("click", () => {
  const btn = document.getElementById("refresh-btn");
  const status = document.getElementById("run-status");
  const selectedDay = document.getElementById("day").value;
  btn.disabled = true;
  status.textContent = "Refreshing…";
  Promise.all([loadCandidates(), loadDays(selectedDay)])
    .then(() => { status.textContent = "Refreshed."; })
    .catch(err => { status.textContent = "Error: " + err; })
    .finally(() => { btn.disabled = false; });
});

document.getElementById("rows").addEventListener("change", e => {
  const cb = e.target.closest("input.row-select");
  if (!cb) return;
  const id = Number(cb.dataset.id);
  if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
  updateSelectionUI(lastVisibleRows);
});

document.getElementById("select-all").addEventListener("change", e => {
  if (e.target.checked) lastVisibleRows.forEach(r => selectedIds.add(r.detection_id));
  else lastVisibleRows.forEach(r => selectedIds.delete(r.detection_id));
  render();
});

document.getElementById("select-all-mobile").addEventListener("change", e => {
  if (e.target.checked) lastVisibleRows.forEach(r => selectedIds.add(r.detection_id));
  else lastVisibleRows.forEach(r => selectedIds.delete(r.detection_id));
  render();
});

function customConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirm-overlay");
    const okBtn = document.getElementById("confirm-ok");
    const cancelBtn = document.getElementById("confirm-cancel");
    document.getElementById("confirm-message").textContent = message;
    overlay.classList.add("active");
    function cleanup(result) {
      overlay.classList.remove("active");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onBackdrop);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onBackdrop(e) { if (e.target === overlay) cleanup(false); }
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onBackdrop);
  });
}

function selectedSummary(ids) {
  const MAX = 8;
  const names = ids.map(id => {
    const rec = allData.find(r => r.detection_id === id);
    return rec ? `${rec.common_name} #${id}` : `#${id}`;
  });
  if (names.length <= MAX) return names.join("\n");
  return names.slice(0, MAX).join("\n") + `\n+${names.length - MAX} more`;
}

async function submitReview(verified, label) {
  const ids = Array.from(selectedIds);
  if (ids.length === 0) return;
  const message = `Mark ${ids.length} detection(s) as ${label} in BirdNET-Go?\n\n${selectedSummary(ids)}`;
  const confirmed = await customConfirm(message);
  if (!confirmed) return;
  const status = document.getElementById("review-status");
  document.getElementById("accept-btn").disabled = true;
  document.getElementById("false-positive-btn").disabled = true;
  document.getElementById("player-accept-btn").disabled = true;
  document.getElementById("player-false-positive-btn").disabled = true;
  status.textContent = "Saving…";
  fetch("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ detection_ids: ids, verified }),
  })
    .then(r => r.json())
    .then(resp => {
      if (resp.error) {
        status.textContent = "Error: " + resp.error;
        return;
      }
      status.textContent = `Marked ${resp.count} as ${label}.`;
      selectedIds.clear();
      closePlayer();
      return Promise.all([loadCandidates(), loadDays()]);
    })
    .catch(err => { status.textContent = "Error: " + err; })
    .finally(() => updateSelectionUI(lastVisibleRows));
}

document.getElementById("accept-btn").addEventListener("click", () => submitReview("correct", "Correct"));
document.getElementById("false-positive-btn").addEventListener("click", () => submitReview("false_positive", "False Positive"));

function toggleDropdown(panel, others) {
  const willOpen = !panel.classList.contains("open");
  others.forEach(p => p.classList.remove("open"));
  panel.classList.toggle("open", willOpen);
}

document.getElementById("menu-btn").addEventListener("click", () => {
  toggleDropdown(document.getElementById("menu-panel"), [document.getElementById("search-panel")]);
});
document.getElementById("search-btn").addEventListener("click", () => {
  toggleDropdown(document.getElementById("search-panel"), [document.getElementById("menu-panel")]);
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("day").addEventListener("change", () => {
  enforceDayScope();
  render();
});
document.getElementById("all-days").addEventListener("change", () => {
  enforceDayScope();
  render();
});
document.getElementById("confirm-threshold").addEventListener("input", render);
document.getElementById("rare-max").addEventListener("change", () => Promise.all([loadCandidates(), loadDays()]));
document.getElementById("compact").addEventListener("change", e => {
  document.querySelector("table").classList.toggle("compact", e.target.checked);
});
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.dataset.filter;
    render();
  });
});
document.querySelectorAll("th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    render();
  });
});
function closePlayer() {
  const audio = document.getElementById("audio");
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  document.getElementById("player-bar").classList.remove("active");
  document.querySelectorAll("button.play").forEach(b => b.classList.remove("playing"));
}

document.getElementById("rows").addEventListener("click", e => {
  const btn = e.target.closest("button.play");
  if (!btn) return;
  document.querySelectorAll("button.play").forEach(b => b.classList.remove("playing"));
  btn.classList.add("playing");
  const audio = document.getElementById("audio");
  audio.src = "/audio/" + btn.dataset.clip;
  document.getElementById("player-label").textContent = btn.dataset.label;
  document.getElementById("player-bar").classList.add("active");
  audio.play();

  const id = Number(btn.dataset.id);
  selectedIds.clear();
  selectedIds.add(id);
  document.querySelectorAll("input.row-select").forEach(cb => {
    cb.checked = Number(cb.dataset.id) === id;
  });
  updateSelectionUI(lastVisibleRows);
});

document.getElementById("player-accept-btn").addEventListener("click", () => submitReview("correct", "Correct"));
document.getElementById("player-false-positive-btn").addEventListener("click", () => submitReview("false_positive", "False Positive"));
document.getElementById("player-close-btn").addEventListener("click", closePlayer);

document.addEventListener("click", e => {
  const bar = document.getElementById("player-bar");
  if (!bar.classList.contains("active")) return;
  if (bar.contains(e.target)) return;
  if (e.target.closest("button.play")) return;
  closePlayer();
});

Promise.all([loadCandidates(), loadDays(), loadConfig()])
  .then(() => render())
  .catch(err => {
    document.getElementById("subtitle").textContent = "Failed to load: " + err;
  });
</script>
