<script>
let allData = [];
let sortKey = "species";
let sortDir = 1;
let activeFilter = "all";
let selectedIds = new Set();
let lastVisibleRows = [];
let lastVisibleLockedRows = [];
let lastScopedRows = [];
let playerLocked = false;
let birdnetgoWebUrl = "";
let currentPlayerDetectionId = null;
let viewMode = "candidates"; // "candidates" | "locked"
let lockedData = [];
let lockedActiveFilter = "all";

function openSpectrogramOverlay() {
  if (!currentPlayerDetectionId) return;
  document.getElementById("spectrogram-full").src = spectrogramUrl(currentPlayerDetectionId, "lg", false);
  document.getElementById("spectrogram-overlay").classList.add("active");
}
function closeSpectrogramOverlay() {
  document.getElementById("spectrogram-overlay").classList.remove("active");
  document.getElementById("spectrogram-full").removeAttribute("src");
}
document.getElementById("player-spectrogram-btn").addEventListener("click", openSpectrogramOverlay);
document.getElementById("spectrogram-close").addEventListener("click", closeSpectrogramOverlay);
document.getElementById("spectrogram-overlay").addEventListener("click", e => {
  if (e.target.id === "spectrogram-overlay") closeSpectrogramOverlay();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSpectrogramOverlay();
});

// Playback audio effects (gain / low-cut / normalize / denoise), built with
// the Web Audio API on top of the existing <audio> element -- same signal
// chain as BirdNET-Go's own player (highpass -> gain -> dynamics
// compressor), but reimplemented directly since BirdNET-Go's own page can't
// be embedded (it sends X-Frame-Options: SAMEORIGIN).
//
// Gain and Low-cut mirror BirdNET-Go's own client-side chain exactly
// (highpass -> gain -> dynamics compressor, same coefficients). Denoise is
// different: BirdNET-Go doesn't do it in the browser at all -- it re-encodes
// the clip server-side through FFmpeg's afftdn filter and swaps in the
// processed file. We reuse that instead of guessing at an equivalent, by
// asking our own backend to run the same ffmpeg filter (see /audio-denoised/
// in server.py) and pointing <audio> at the result.
let audioCtx = null, fxHighpass = null, fxGain = null, fxCompressor = null;
let currentClipName = null;

function ensureAudioGraph() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(document.getElementById("audio"));
  fxHighpass = audioCtx.createBiquadFilter();
  fxHighpass.type = "highpass";
  fxHighpass.Q.value = 1;
  fxHighpass.frequency.value = Number(document.getElementById("fx-highpass").value);
  fxGain = audioCtx.createGain();
  fxGain.gain.value = dbToLinear(Number(document.getElementById("fx-gain").value));
  fxCompressor = audioCtx.createDynamicsCompressor();
  setNormalize(document.getElementById("fx-normalize").checked);
  source.connect(fxHighpass).connect(fxGain).connect(fxCompressor).connect(audioCtx.destination);
}

function dbToLinear(db) {
  return 10 ** (db / 20);
}

function setNormalize(on) {
  if (!fxCompressor) return;
  fxCompressor.threshold.value = on ? -24 : 0;
  fxCompressor.knee.value = on ? 30 : 0;
  fxCompressor.ratio.value = on ? 12 : 1;
  fxCompressor.attack.value = 0.003;
  fxCompressor.release.value = 0.25;
}

document.getElementById("fx-gain").addEventListener("input", e => {
  const db = Number(e.target.value);
  document.getElementById("fx-gain-label").textContent = (db > 0 ? "+" : "") + db + "dB";
  if (fxGain) fxGain.gain.value = dbToLinear(db);
});
document.getElementById("fx-highpass").addEventListener("change", e => {
  if (fxHighpass) fxHighpass.frequency.value = Number(e.target.value);
});
document.getElementById("fx-normalize").addEventListener("change", e => setNormalize(e.target.checked));

function clipUrlForDenoise(level) {
  const clip = encodeURIComponent(currentClipName);
  return level === "off"
    ? "/audio/" + clip
    : `/audio-denoised/${clip}?level=${level}`;
}

document.getElementById("fx-denoise").addEventListener("change", e => {
  if (!currentClipName) return;
  const select = e.target;
  const audio = document.getElementById("audio");
  const resumeAt = audio.currentTime;
  const wasPlaying = !audio.paused;
  select.disabled = true;
  const onReady = () => {
    audio.removeEventListener("loadedmetadata", onReady);
    audio.removeEventListener("error", onReady);
    audio.currentTime = resumeAt;
    if (wasPlaying) audio.play();
    select.disabled = false;
  };
  audio.addEventListener("loadedmetadata", onReady);
  audio.addEventListener("error", onReady);
  audio.src = clipUrlForDenoise(select.value);
});

// Spectrogram + detection-window marker in the player bar. Reuses
// BirdNET-Go's own spectrogram bitmap (same one shown via the spectrogram
// overlay button) rather than recomputing an STFT ourselves. BirdNET-Go
// exports clips with `precapture` seconds of lead-in before the actual
// detection (see PRECAPTURE_SECONDS in verifier.py -- keep this in sync
// with that), so the marked window is offset into the clip, not at 0.
const PRECAPTURE_SECONDS = 7.0;
const waveformCanvas = document.getElementById("player-waveform");
const waveformCtx = waveformCanvas.getContext("2d");
let waveformToken = 0;
let waveformWindow = null; // {start, end} in seconds, clip-relative
let waveformLabel = "";
let waveformImage = null; // Image, the raw (axis-free) BirdNET-Go spectrogram bitmap

function clearWaveform() {
  waveformToken++;
  waveformImage = null;
  waveformWindow = null;
  waveformCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
}

function drawWaveform() {
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = waveformCanvas.clientWidth;
  const cssHeight = waveformCanvas.clientHeight;
  waveformCanvas.width = cssWidth * dpr;
  waveformCanvas.height = cssHeight * dpr;
  const ctx = waveformCtx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  if (waveformImage) {
    ctx.drawImage(waveformImage, 0, 0, cssWidth, cssHeight);
  }

  const audio = document.getElementById("audio");
  const duration = audio.duration || 0;
  const style = getComputedStyle(document.body);
  const accent = style.getPropertyValue("--accent").trim() || "#3c6e78";
  const surface = style.getPropertyValue("--surface").trim() || "#ffffff";

  if (waveformWindow && duration) {
    const x1 = (waveformWindow.start / duration) * cssWidth;
    const x2 = (waveformWindow.end / duration) * cssWidth;
    ctx.fillStyle = accent + "33";
    ctx.fillRect(x1, 0, Math.max(1, x2 - x1), cssHeight);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.strokeRect(x1, 1, Math.max(1, x2 - x1), cssHeight - 2);

    ctx.font = "10px sans-serif";
    ctx.textBaseline = "top";
    const textW = ctx.measureText(waveformLabel).width;
    const tx = Math.min(x1 + 3, Math.max(0, cssWidth - textW - 6));
    ctx.fillStyle = surface + "cc";
    ctx.fillRect(tx - 2, 1, textW + 4, 12);
    ctx.fillStyle = accent;
    ctx.fillText(waveformLabel, tx, 2);
  }

  if (duration && !audio.paused) {
    const x = (audio.currentTime / duration) * cssWidth;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, cssHeight);
    ctx.stroke();
  }
}

function loadWaveform(detectionId, beginMs, endMs, species, conf) {
  clearWaveform();
  const token = waveformToken;
  if (beginMs !== "" && endMs !== "" && beginMs != null && endMs != null) {
    const start = PRECAPTURE_SECONDS;
    const end = start + (Number(endMs) - Number(beginMs)) / 1000;
    waveformWindow = { start, end };
    waveformLabel = `${species || ""} ${conf !== "" && conf != null ? fmtConf(Number(conf)) : ""}`.trim();
  }
  const img = new Image();
  img.onload = () => {
    if (token !== waveformToken) return; // player moved on to another clip
    waveformImage = img;
    drawWaveform();
  };
  img.onerror = () => { /* spectrogram is a visual extra, playback still works without it */ };
  img.src = spectrogramUrl(detectionId, "lg", true);
}

document.getElementById("audio").addEventListener("loadedmetadata", drawWaveform);
document.getElementById("audio").addEventListener("timeupdate", drawWaveform);
document.getElementById("audio").addEventListener("play", drawWaveform);
document.getElementById("audio").addEventListener("pause", drawWaveform);
waveformCanvas.addEventListener("click", e => {
  const audio = document.getElementById("audio");
  if (!audio.duration) return;
  const rect = waveformCanvas.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  audio.currentTime = Math.max(0, Math.min(1, frac)) * audio.duration;
  if (audio.paused) audio.play();
});
window.addEventListener("resize", () => { if (waveformImage) drawWaveform(); });

const PILL_LETTER = { confirm: "C", weak_match: "W", disagree: "D", no_detection: "N", not_run: "–" };
const PILL_TITLE = { confirm: "Confirm", weak_match: "Weak match (same species, below confirm threshold)", disagree: "Disagree", no_detection: "No detection", not_run: "Not run" };
const OVERALL_LETTER = { auto_confirm: "CC", auto_reject: "DD", manual_review: "MD", no_detection: "NN", not_run: "–" };
const OVERALL_TITLE = {
  auto_confirm: "CC — both models confirm, auto-confirmable",
  auto_reject: "DD — species mismatch or missing detection somewhere, auto-rejectable",
  manual_review: "MD — models agree on the species but confidence is split, needs manual review",
  no_detection: "NN — neither model detected anything",
  not_run: "Not run",
};
const FILTER_LABEL = { auto_confirm: "CC Auto-confirm", auto_reject: "DD Auto-reject", manual_review: "MD Manual review", no_detection: "No detection", not_run: "Not run" };

function pill(verdict) {
  const letter = PILL_LETTER[verdict] || "?";
  const title = PILL_TITLE[verdict] || verdict;
  return `<span class="pill ${verdict}" title="${title}">${letter}</span>`;
}

function overallPill(verdict, detectionId) {
  const letter = OVERALL_LETTER[verdict] || "?";
  const title = OVERALL_TITLE[verdict] || verdict;
  const auto = (verdict === "auto_confirm" || verdict === "auto_reject")
    ? `<button type="button" class="auto-icon auto-row-btn" data-id="${detectionId}" data-verdict="${verdict}" title="Auto-apply this detection now">⚡</button>`
    : "";
  return `<span class="pill pill-wide ${verdict}" title="${title}">${letter}</span>${auto}`;
}

function spectrogramUrl(detectionId, size, raw) {
  return `${birdnetgoWebUrl}/api/v2/spectrogram/${detectionId}?size=${size}&raw=${raw}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function xenoCantoUrl(species) {
  return `https://xeno-canto.org/species/${encodeURIComponent(species.replace(/ /g, "-"))}`;
}

function model2Cell(v, label) {
  const detail = v.top_species
    ? `<div class="model2-detail-row">` +
        `<div class="model2-names">` +
          `<a class="model2-sci-link" href="${xenoCantoUrl(v.top_species)}" target="_blank" rel="noopener"><span class="model2-sci">${v.top_species}</span></a>` +
          `<span class="model2-common">${v.top_common_name || ""}</span>` +
        `</div>` +
        `<button type="button" class="xc-toggle" data-species="${v.top_species}" title="Reference recordings from xeno-canto">` +
          `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>` +
        `</button>` +
      `</div>`
    : "";
  return `<td class="model2-cell" data-label="${label}">${pill(v.verdict)} <span class="sub">${fmtConf(v.top_confidence)}</span>${detail}</td>`;
}

// Same as model2Cell but as a <div> instead of a <td> (locked cards aren't
// a table), with an explicit text label since it can't rely on the
// td[data-label]::before CSS trick. The xc-toggle button here shares its
// panel with its sibling model2Box in the same card (see renderLocked's
// single trailing .xc-panel) rather than a per-table-row sibling <tr> --
// note .model2-sci-link itself is pointer-events:none in the mobile card
// layout (candidates included), so the toggle button is the only way to
// reach xeno-canto from a card, not the species name text.
function model2Box(v, label) {
  const detail = v.top_species
    ? `<div class="model2-detail-row">` +
        `<div class="model2-names">` +
          `<a class="model2-sci-link" href="${xenoCantoUrl(v.top_species)}" target="_blank" rel="noopener"><span class="model2-sci">${v.top_species}</span></a>` +
          `<span class="model2-common">${v.top_common_name || ""}</span>` +
        `</div>` +
        `<button type="button" class="xc-toggle" data-species="${v.top_species}" title="Reference recordings from xeno-canto">` +
          `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>` +
        `</button>` +
      `</div>`
    : "";
  return `<div class="model2-cell locked-card-model2">` +
    `<span class="sub">${label}</span> ${pill(v.verdict)} <span class="sub">${fmtConf(v.top_confidence)}</span>${detail}` +
  `</div>`;
}

function fmtConf(c) {
  return c === null || c === undefined ? "—" : c.toFixed(2);
}

function fmtDate(isoDate) {
  const [y, m, d] = isoDate.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" });
}

function fmtDateTime(isoDateTime) {
  return fmtDate(isoDateTime.slice(0, 10)) + isoDateTime.slice(10);
}

function getConfirmThreshold() {
  const v = parseFloat(document.getElementById("confirm-threshold").value);
  return Number.isFinite(v) ? v : 0.8;
}

function getRarityParams() {
  const max = document.getElementById("rare-max").value;
  return new URLSearchParams({ rare_min: 1, rare_max: max });
}

function recomputeModelVerdict(v, originalSpecies, threshold) {
  if (v.verdict === "not_run") return v;
  let verdict;
  const sameSpecies = v.top_species === originalSpecies;
  if (v.top_species === null) verdict = "no_detection";
  else if (sameSpecies && v.top_confidence >= threshold) verdict = "confirm";
  else if (sameSpecies) verdict = "weak_match";
  else verdict = "disagree";
  return { ...v, verdict };
}

const MATCHING_VERDICTS = new Set(["confirm", "weak_match"]);

function overallBucket(bnVerdict, pcVerdict) {
  if (MATCHING_VERDICTS.has(bnVerdict) && MATCHING_VERDICTS.has(pcVerdict)) {
    return (bnVerdict === "confirm" && pcVerdict === "confirm") ? "auto_confirm" : "manual_review";
  }
  if (bnVerdict === "no_detection" && pcVerdict === "no_detection") return "no_detection";
  return "auto_reject";
}

function withThreshold(r, threshold) {
  const bn = recomputeModelVerdict(r.verify_birdnet_v24, r.species, threshold);
  const pc = recomputeModelVerdict(r.verify_perch_v2, r.species, threshold);
  const overall = bn.verdict === "not_run" ? "not_run" : overallBucket(bn.verdict, pc.verdict);
  return { ...r, verify_birdnet_v24: bn, verify_perch_v2: pc, overall_verdict: overall };
}

function isAllDays() {
  return document.getElementById("day").value === "__all__";
}

function enforceDayScope() {
  if (isAllDays()) return;
  const selectedDay = document.getElementById("day").value;
  selectedIds.forEach(id => {
    const rec = allData.find(r => r.detection_id === id);
    if (!rec || !rec.detected_at_local.startsWith(selectedDay)) selectedIds.delete(id);
  });
}

function scopedData() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const showAllDays = isAllDays();
  const selectedDay = document.getElementById("day").value;
  const threshold = getConfirmThreshold();
  return allData.filter(r => {
    if (!showAllDays && selectedDay && !r.detected_at_local.startsWith(selectedDay)) return false;
    if (!q) return true;
    return r.species.toLowerCase().includes(q) || r.common_name.toLowerCase().includes(q) || String(r.detection_id).includes(q);
  }).map(r => withThreshold(r, threshold));
}

function render() {
  const scoped = scopedData();
  updateCounts(scoped);
  let rows = scoped.filter(r => activeFilter === "all" || r.overall_verdict === activeFilter);

  rows.sort((a, b) => {
    let va, vb;
    if (sortKey === "species") { va = a.common_name; vb = b.common_name; }
    else if (sortKey === "overall_verdict") { va = a.overall_verdict; vb = b.overall_verdict; }
    else if (sortKey === "bn_verdict") { va = a.verify_birdnet_v24.verdict; vb = b.verify_birdnet_v24.verdict; }
    else if (sortKey === "pc_verdict") { va = a.verify_perch_v2.verdict; vb = b.verify_perch_v2.verdict; }
    else if (sortKey === "model") { va = a.model; vb = b.model; }
    else if (sortKey === "confidence") { va = a.confidence; vb = b.confidence; }
    else { va = a[sortKey]; vb = b[sortKey]; }
    if (va < vb) return -1 * sortDir;
    if (va > vb) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById("rows");
  tbody.innerHTML = rows.map((r, i) => {
    const bn = r.verify_birdnet_v24, pc = r.verify_perch_v2;
    const altClass = i % 2 === 1 ? " row-alt" : "";
    const clipAttr = r.clip_name ? `data-clip="${r.clip_name}" data-label="${r.common_name} #${r.detection_id}" data-id="${r.detection_id}" data-begin="${r.begin_time ?? ""}" data-end="${r.end_time ?? ""}" data-species="${escapeHtml(r.common_name)}" data-conf="${r.confidence ?? ""}"` : "";
    const sciLine = r.common_name !== r.species ? `<span class="species-sci">${r.species}</span>` : "";
    const reviewUrl = `${birdnetgoWebUrl}/ui/detections/${r.detection_id}?tab=review`;
    return `<tr class="${r.clip_exists ? "" : "no-clip"}${altClass}" data-verdict="${r.overall_verdict}">
      <td data-label="Select"><input type="checkbox" class="row-select" data-id="${r.detection_id}" ${selectedIds.has(r.detection_id) ? "checked" : ""} ${playerLocked ? "disabled" : ""}></td>
      <td data-label="Overall">${r.locked_via_validator !== undefined ? originPill(r.locked_via_validator) : ""}${overallPill(r.overall_verdict, r.detection_id)}</td>
      <td class="species-cell" data-label="Species"><a class="species-link" href="${reviewUrl}" target="_blank" rel="noopener"><span class="species-common">${r.common_name}</span>${sciLine}</a></td>
      <td data-label="ID" class="mono">${r.detection_id}</td>
      <td data-label="Date/time" class="mono">${fmtDateTime(r.detected_at_local.slice(0, 16).replace("T", " "))}</td>
      <td data-label="Model">${r.model}</td>
      <td data-label="Conf." class="mono">${fmtConf(r.confidence)}</td>
      ${model2Cell(bn, "BirdNET (2nd)")}
      ${model2Cell(pc, "Perch (2nd)")}
      <td data-label="Play">${r.clip_exists ? `<button class="play" ${clipAttr}>▶</button>` : "—"}</td>
    </tr>
    <tr class="xc-row"><td colspan="10"><div class="xc-panel"></div></td></tr>`;
  }).join("");

  const filterSuffix = activeFilter === "all" ? "" : ` (${escapeHtml(FILTER_LABEL[activeFilter] || activeFilter)})`;
  const rareMax = document.getElementById("rare-max").value;
  const dayScope = isAllDays()
    ? "(all days)"
    : `for ${escapeHtml(fmtDate(document.getElementById("day").value))}`;
  document.getElementById("subtitle").innerHTML =
    `<span class="nowrap">Showing ${rows.length}${filterSuffix} of ${scoped.length} candidates</span> ` +
    `<span class="nowrap">${dayScope}</span> · ` +
    `<span class="nowrap">rarity 1–${rareMax}</span> · ` +
    `<span class="nowrap">confirm ≥ ${getConfirmThreshold().toFixed(2)}</span>`;

  lastVisibleRows = rows;
  lastScopedRows = scoped;
  document.getElementById("auto-btn").disabled =
    !scoped.some(r => r.overall_verdict === "auto_confirm" || r.overall_verdict === "auto_reject");
  updateSelectionUI(rows);
}

function updateSelectionUI(visibleRows) {
  const count = selectedIds.size;
  document.getElementById("selection-count").textContent =
    count === 0 ? "No detections selected" : `${count} selected`;
  document.getElementById("toolbar-actions-info").classList.toggle("has-selection", count > 0);
  document.getElementById("accept-btn").disabled = count === 0;
  document.getElementById("false-positive-btn").disabled = count === 0;
  document.getElementById("lock-btn").disabled = count === 0;
  document.getElementById("player-accept-btn").disabled = count === 0;
  document.getElementById("player-false-positive-btn").disabled = count === 0;
  document.getElementById("player-lock-btn").disabled = count === 0;
  // In the locked view, "Birda" runs on the selection instead of a day
  // (see runBirda) -- disable it the same way as Accept/False/Unlock when
  // nothing's selected. In candidates view it stays day-driven, untouched
  // here (runBirda re-enables it on its own after a run).
  if (viewMode === "locked") {
    document.getElementById("run-btn").disabled = count === 0;
  }

  const selectAll = document.getElementById("select-all");
  const selectAllMobile = document.getElementById("select-all-mobile");
  selectAll.disabled = playerLocked;
  selectAllMobile.disabled = playerLocked;
  if (visibleRows.length === 0) {
    selectAll.checked = false;
    selectAll.indeterminate = false;
  } else {
    const selectedVisible = visibleRows.filter(r => selectedIds.has(r.detection_id)).length;
    selectAll.checked = selectedVisible === visibleRows.length;
    selectAll.indeterminate = selectedVisible > 0 && selectedVisible < visibleRows.length;
  }
  selectAllMobile.checked = selectAll.checked;
  selectAllMobile.indeterminate = selectAll.indeterminate;
}

function updateCounts(scoped) {
  const counts = { all: scoped.length, auto_confirm: 0, auto_reject: 0, manual_review: 0, no_detection: 0, not_run: 0 };
  scoped.forEach(r => {
    counts[r.overall_verdict] = (counts[r.overall_verdict] || 0) + 1;
  });
  for (const k of ["all", "auto_confirm", "auto_reject", "manual_review", "no_detection", "not_run"]) {
    document.getElementById(`count-${k}`).textContent = `(${counts[k] || 0})`;
  }
}

function loadDays(selectDay) {
  return fetch("/api/days?" + getRarityParams()).then(r => r.json()).then(days => {
    const sel = document.getElementById("day");
    const prev = selectDay || sel.value;
    sel.innerHTML = `<option value="__all__">All days</option>` +
      `<option value="__locked__">🔒 Locked</option>` +
      days.map(d =>
        `<option value="${d.day}">${fmtDate(d.day)} — ${d.with_clip} candidate(s), ${d.verified} verified</option>`
      ).join("");
    if (prev === "__all__" || prev === "__locked__" || (prev && days.some(d => d.day === prev))) sel.value = prev;
    else if (days.length) sel.value = days[0].day;
  });
}

function loadCandidates() {
  return fetch("/api/candidates?" + getRarityParams()).then(r => r.json()).then(data => {
    allData = data;
    const stillPresent = new Set(data.map(r => r.detection_id));
    selectedIds.forEach(id => { if (!stillPresent.has(id)) selectedIds.delete(id); });
    render();
  });
}

function loadConfig() {
  return fetch("/api/config").then(r => r.json()).then(cfg => {
    birdnetgoWebUrl = cfg.birdnetgo_web_url || "";
  });
}

// Locked view: browses every currently-locked detection regardless of age
// (locking is meant to keep a detection around for a later second look, so
// it's explicitly not limited to the normal 7-day candidate window).
function lockedMatchesFilter(r, filter) {
  if (filter === "all") return true;
  if (filter === "locked_go") return !r.locked_via_validator;
  if (filter === "locked_validator") return r.locked_via_validator;
  if (filter === "verified_accept") return r.verified === "correct";
  if (filter === "verified_false") return r.verified === "false_positive";
  return true;
}

function updateLockedCounts() {
  const counts = { all: lockedData.length, locked_go: 0, locked_validator: 0, verified_accept: 0, verified_false: 0 };
  lockedData.forEach(r => {
    if (!r.locked_via_validator) counts.locked_go++;
    if (r.locked_via_validator) counts.locked_validator++;
    if (r.verified === "correct") counts.verified_accept++;
    if (r.verified === "false_positive") counts.verified_false++;
  });
  for (const k of Object.keys(counts)) {
    document.getElementById(`lcount-${k}`).textContent = `(${counts[k]})`;
  }
}

function statusPill(verified) {
  if (verified === "correct") return `<span class="pill status-accept" title="Verified Accept">✓</span>`;
  if (verified === "false_positive") return `<span class="pill status-false" title="Verified False">✕</span>`;
  return `<span class="pill status-open" title="Unverified">?</span>`;
}

function originPill(lockedViaValidator) {
  return lockedViaValidator
    ? `<span class="pill origin-validator" title="Locked (Validator)">V</span>`
    : `<span class="pill origin-go" title="Locked (Go)">G</span>`;
}

// Card markup deliberately mirrors the candidate table's mobile card (same
// checkbox + pill + species + id + play header, same detail line below) so
// the two views look like one component. Per-row actions (Unlock/Accept/
// False) live in the shared bottom bar instead, driven by selectedIds.
function renderLocked() {
  updateLockedCounts();
  const threshold = getConfirmThreshold();
  const rows = lockedData.filter(r => lockedMatchesFilter(r, lockedActiveFilter));
  const container = document.getElementById("locked-rows");
  container.innerHTML = rows.map(r => {
    const bn = recomputeModelVerdict(r.verify_birdnet_v24, r.species, threshold);
    const pc = recomputeModelVerdict(r.verify_perch_v2, r.species, threshold);
    const clipAttr = r.clip_name
      ? `data-clip="${r.clip_name}" data-label="${r.common_name} #${r.detection_id}" data-id="${r.detection_id}" data-begin="${r.begin_time ?? ""}" data-end="${r.end_time ?? ""}" data-species="${escapeHtml(r.common_name)}" data-conf="${r.confidence ?? ""}"`
      : "";
    const sciLine = r.common_name !== r.species ? `<span class="species-sci">${r.species}</span>` : "";
    const reviewUrl = `${birdnetgoWebUrl}/ui/detections/${r.detection_id}?tab=review`;
    return `<div class="locked-card${r.clip_exists ? "" : " no-clip"}" data-id="${r.detection_id}">
      <input type="checkbox" class="row-select" data-id="${r.detection_id}" ${selectedIds.has(r.detection_id) ? "checked" : ""} ${playerLocked ? "disabled" : ""}>
      ${originPill(r.locked_via_validator)}
      ${statusPill(r.verified)}
      <a class="species-link locked-card-species" href="${reviewUrl}" target="_blank" rel="noopener"><span class="species-common">${r.common_name}</span>${sciLine}</a>
      <span class="locked-card-id mono">#${r.detection_id}</span>
      ${r.clip_exists ? `<button class="play" ${clipAttr}>▶</button>` : "—"}
      <span class="locked-card-detail mono">${fmtDateTime(r.detected_at_local.slice(0, 16).replace("T", " "))}</span>
      <span class="locked-card-detail mono">${r.model}</span>
      <span class="locked-card-detail mono">conf ${fmtConf(r.confidence)}</span>
      ${model2Box(bn, "BirdNET (2nd)")}
      ${model2Box(pc, "Perch (2nd)")}
      <div class="xc-panel"></div>
    </div>`;
  }).join("");

  document.getElementById("locked-subtitle").textContent =
    `Showing ${rows.length} of ${lockedData.length} locked detection(s)`;
  lastVisibleLockedRows = rows;
  updateSelectionUI(rows);
}

function loadLocked() {
  return fetch("/api/locked").then(r => r.json()).then(data => {
    lockedData = data;
    renderLocked();
  });
}

document.querySelectorAll("#locked-tabs .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#locked-tabs .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    lockedActiveFilter = tab.dataset.lockfilter;
    renderLocked();
  });
});

document.getElementById("locked-rows").addEventListener("change", e => {
  const cb = e.target.closest("input.row-select");
  if (!cb) return;
  const id = Number(cb.dataset.id);
  if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
  updateSelectionUI(lastVisibleLockedRows);
});

// Lock/Hold is the one bulk-action button whose verb flips with the view:
// candidates get "Hold" (lock for later), the locked view gets "Unlock".
function updateLockButtonLabel() {
  const locking = viewMode !== "locked";
  const label = locking ? "🔒 Hold" : "🔓 Unlock";
  const title = locking
    ? "Lock in BirdNET-Go for a later second look, independent of Accept/False"
    : "Unlock in BirdNET-Go";
  for (const id of ["lock-btn", "player-lock-btn"]) {
    const btn = document.getElementById(id);
    btn.textContent = label;
    btn.title = title;
  }
}

// "Birda" runs on the day-scoped candidate list in candidates view, but
// there's no day concept for locked detections (they can be any age), so
// in the locked view it runs on the current selection instead (see
// runBirda). Title text flips to match, same as the Lock/Hold button.
function updateRunButtonTitle() {
  const title = viewMode === "locked"
    ? "Run birda for the selected locked detection(s)"
    : "Run birda for the selected day";
  document.getElementById("run-btn").title = title;
}

// mode is driven entirely by the #day select now (a "🔒 Locked" entry
// alongside "All days" and each real day -- see loadDays and the #day
// change handler below), not a separate toggle button, so this never
// needs to touch #day itself.
function setViewMode(mode) {
  viewMode = mode;
  document.getElementById("auto-btn").hidden = mode === "locked";
  // review-status lives in the now-shared bottom bar, so clear stale text
  // from the other view instead of leaving it visible across a switch.
  document.getElementById("review-status").textContent = "";
  document.getElementById("locked-status").textContent = "";

  // Selection is one global "N selected" in the shared bottom bar, but
  // candidates and locked cards are different lists -- carrying a selection
  // across a switch left invisible items selected (and stale-checked
  // checkboxes on cards that hadn't been re-rendered), so start clean.
  selectedIds.clear();
  document.querySelectorAll("input.row-select:checked").forEach(cb => { cb.checked = false; });

  if (mode === "locked") {
    document.getElementById("candidates-view").hidden = true;
    document.getElementById("locked-view").hidden = false;
    // Always refetch (not just on first visit) -- locks/unlocks made
    // directly in BirdNET-Go's own GUI, or a moment ago via this webapp,
    // wouldn't otherwise show up until a full page reload.
    loadLocked();
  } else {
    document.getElementById("candidates-view").hidden = false;
    document.getElementById("locked-view").hidden = true;
    updateSelectionUI(lastVisibleRows);
    // Candidates' Birda is day-driven, not selection-gated -- undo any
    // disabled-by-empty-selection state left over from the locked view.
    document.getElementById("run-btn").disabled = false;
  }
  updateLockButtonLabel();
  updateRunButtonTitle();
}

function runBirda() {
  const force = document.getElementById("force").checked;
  const btn = document.getElementById("run-btn");
  const status = document.getElementById("run-status");

  // Locked detections aren't day-scoped (they can be any age -- that's the
  // whole point of the view), so there's no "day" to run birda for here.
  // Run on the current selection instead, the same way Accept/False/Unlock
  // already work in this view.
  if (viewMode === "locked") {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    btn.disabled = true;
    status.textContent = `Running birda on ${ids.length} selected…`;
    fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ detection_ids: ids, force, confirm_threshold: getConfirmThreshold() }),
    })
      .then(r => r.json())
      .then(resp => {
        if (resp.error) {
          status.textContent = "Error: " + resp.error;
          return;
        }
        status.textContent = `Done: ran ${resp.ran}, skipped ${resp.skipped_cached} already cached.`;
        return loadLocked();
      })
      .catch(err => { status.textContent = "Error: " + err; })
      .finally(() => { btn.disabled = false; updateSelectionUI(lastVisibleLockedRows); });
    return;
  }

  const day = document.getElementById("day").value;
  if (!day || day === "__all__") return;
  btn.disabled = true;
  status.textContent = `Running birda on ${day}…`;
  fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      day, force,
      confirm_threshold: getConfirmThreshold(),
      rare_min: 1,
      rare_max: document.getElementById("rare-max").value,
    }),
  })
    .then(r => r.json())
    .then(resp => {
      if (resp.error) {
        status.textContent = "Error: " + resp.error;
        return;
      }
      status.textContent = `Done: ran ${resp.ran}, skipped ${resp.skipped_cached} already cached.`;
      return Promise.all([loadCandidates(), loadDays(day)]);
    })
    .catch(err => { status.textContent = "Error: " + err; })
    .finally(() => { btn.disabled = false; });
}

function runCleanup() {

  const status = document.getElementById("run-status");
  btn.disabled = true;

}

function customConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirm-overlay");
    const okBtn = document.getElementById("confirm-ok");
    const cancelBtn = document.getElementById("confirm-cancel");
    document.getElementById("confirm-message").textContent = message;
    overlay.classList.add("active");
    function cleanup(result) {
      overlay.classList.remove("active");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onBackdrop);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onBackdrop(e) { if (e.target === overlay) cleanup(false); }
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onBackdrop);
  });
}

function selectedSummary(ids) {
  const MAX = 8;
  const names = ids.map(id => {
    const rec = allData.find(r => r.detection_id === id) || lockedData.find(r => r.detection_id === id);
    return rec ? `${rec.common_name} #${id}` : `#${id}`;
  });
  if (names.length <= MAX) return names.join("\n");
  return names.slice(0, MAX).join("\n") + `\n+${names.length - MAX} more`;
}

async function postReview(ids, verified, source) {
  const resp = await fetch("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ detection_ids: ids, verified, source }),
  });
  return resp.json();
}

async function submitAuto() {
  const confirmIds = lastScopedRows.filter(r => r.overall_verdict === "auto_confirm").map(r => r.detection_id);
  const rejectIds = lastScopedRows.filter(r => r.overall_verdict === "auto_reject").map(r => r.detection_id);
  if (confirmIds.length === 0 && rejectIds.length === 0) return;
  const message =
    `Auto-process ${confirmIds.length} CC as Correct and ${rejectIds.length} DD as False positive in BirdNET-Go?\n\n` +
    selectedSummary([...confirmIds, ...rejectIds]);
  const confirmed = await customConfirm(message);
  if (!confirmed) return;
  const status = document.getElementById("review-status");
  const autoBtn = document.getElementById("auto-btn");
  autoBtn.disabled = true;
  status.textContent = "Auto-processing…";
  try {
    const results = [];
    if (confirmIds.length) results.push(await postReview(confirmIds, "correct", "auto"));
    if (rejectIds.length) results.push(await postReview(rejectIds, "false_positive", "auto"));
    const errors = results.filter(r => r.error);
    if (errors.length) {
      status.textContent = "Error: " + errors.map(e => e.error).join("; ");
    } else {
      const total = results.reduce((sum, r) => sum + (r.count || 0), 0);
      status.textContent = `Auto-processed ${total} detection(s) (${confirmIds.length} CC, ${rejectIds.length} DD).`;
    }
    await Promise.all([loadCandidates(), loadDays()]);
  } catch (err) {
    status.textContent = "Error: " + err;
  }
}

async function submitAutoRow(id, verdict, btn) {
  const verified = verdict === "auto_confirm" ? "correct" : "false_positive";
  const label = verdict === "auto_confirm" ? "Correct" : "False Positive";
  const message = `Mark this detection as ${label} in BirdNET-Go?\n\n${selectedSummary([id])}`;
  const confirmed = await customConfirm(message);
  if (!confirmed) return;
  const status = document.getElementById("review-status");
  btn.disabled = true;
  status.textContent = "Saving…";
  try {
    const resp = await postReview([id], verified, "auto");
    if (resp.error) {
      status.textContent = "Error: " + resp.error;
      btn.disabled = false;
      return;
    }
    status.textContent = `Marked #${id} as ${label}.`;
    await Promise.all([loadCandidates(), loadDays()]);
  } catch (err) {
    status.textContent = "Error: " + err;
    btn.disabled = false;
  }
}

function refreshActiveView() {
  return viewMode === "locked" ? loadLocked() : Promise.all([loadCandidates(), loadDays()]);
}

function currentVisibleRows() {
  return viewMode === "locked" ? lastVisibleLockedRows : lastVisibleRows;
}

function setActionStatus(msg) {
  document.getElementById(viewMode === "locked" ? "locked-status" : "review-status").textContent = msg;
}

async function submitReview(verified, label, idsOverride) {
  const ids = idsOverride || Array.from(selectedIds);
  if (ids.length === 0) return;
  const message = `Mark ${ids.length} detection(s) as ${label} in BirdNET-Go?\n\n${selectedSummary(ids)}`;
  const confirmed = await customConfirm(message);
  if (!confirmed) return;
  document.getElementById("accept-btn").disabled = true;
  document.getElementById("false-positive-btn").disabled = true;
  document.getElementById("player-accept-btn").disabled = true;
  document.getElementById("player-false-positive-btn").disabled = true;
  setActionStatus("Saving…");
  fetch("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ detection_ids: ids, verified, source: "manual" }),
  })
    .then(r => r.json())
    .then(resp => {
      if (resp.error) {
        setActionStatus("Error: " + resp.error);
        return;
      }
      setActionStatus(`Marked ${resp.count} as ${label}.`);
      selectedIds.clear();
      closePlayer();
      return refreshActiveView();
    })
    .catch(err => { setActionStatus("Error: " + err); })
    .finally(() => updateSelectionUI(currentVisibleRows()));
}

document.getElementById("accept-btn").addEventListener("click", () => submitReview("correct", "Correct"));
document.getElementById("false-positive-btn").addEventListener("click", () => submitReview("false_positive", "False Positive"));
document.getElementById("auto-btn").addEventListener("click", submitAuto);

// Lock is independent of Accept/False -- a locked detection stays
// unverified until (and unless) Accept/False is also clicked, so this
// deliberately leaves the player open and the selection intact, unlike
// submitReview() which closes the player since it resolves the candidate.
async function submitLock(locked, idsOverride, skipConfirm) {
  const ids = idsOverride || Array.from(selectedIds);
  if (ids.length === 0) return;
  if (!skipConfirm) {
    const message = `${locked ? "Lock" : "Unlock"} ${ids.length} detection(s) in BirdNET-Go${locked ? " for a later second look" : ""}?\n\n${selectedSummary(ids)}`;
    const confirmed = await customConfirm(message);
    if (!confirmed) return;
  }
  document.getElementById("lock-btn").disabled = true;
  document.getElementById("player-lock-btn").disabled = true;
  setActionStatus(locked ? "Locking…" : "Unlocking…");
  return fetch("/api/lock", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ detection_ids: ids, locked, source: "manual" }),
  })
    .then(r => r.json())
    .then(resp => {
      if (resp.error) {
        setActionStatus("Error: " + resp.error);
        return;
      }
      setActionStatus(`${locked ? "Locked" : "Unlocked"} ${resp.count} detection(s).`);
      return refreshActiveView();
    })
    .catch(err => { setActionStatus("Error: " + err); })
    .finally(() => updateSelectionUI(currentVisibleRows()));
}

// In the locked view, Unlock is low-risk and reversible (the whole point
// of that view is fast browsing), so it skips the confirm dialog; Hold
// (locking from candidates) keeps it since it's a less obviously-reversible
// action to a first-time user.
document.getElementById("lock-btn").addEventListener("click", () => {
  const locking = viewMode !== "locked";
  submitLock(locking, undefined, !locking);
});

document.getElementById("menu-btn").addEventListener("click", () => {
  document.getElementById("menu-panel").classList.toggle("open");
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("day").addEventListener("change", () => {
  const value = document.getElementById("day").value;
  if (value === "__locked__") {
    setViewMode("locked");
    return;
  }
  if (viewMode === "locked") setViewMode("candidates");
  enforceDayScope();
  render();
});
document.getElementById("confirm-threshold").addEventListener("input", () => {
  render();
  if (viewMode === "locked") renderLocked();
});
document.getElementById("rare-max").addEventListener("change", () => Promise.all([loadCandidates(), loadDays()]));
// Scoped to #menu-panel: the Locked view's tabs also carry a bare .tab
// class, and an unscoped querySelectorAll(".tab") here used to also catch
// those clicks (setting activeFilter to undefined via a missing
// data-filter, since locked tabs use data-lockfilter -- every candidate
// row would then fail the filter and the list would render empty until
// "All" was clicked again).
document.querySelectorAll("#menu-panel .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("#menu-panel .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeFilter = tab.dataset.filter;
    render();
  });
});
document.querySelectorAll("th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    render();
  });
});
// The bottom Auto/Accept/False bar's real height varies (it shrinks by a
// row when #toolbar-actions-info is hidden while the player is open, and
// varies further with env(safe-area-inset-bottom) on notched devices), so
// pin the player bar to it by measurement instead of a guessed constant.
function updatePlayerBarPosition() {
  const bar = document.querySelector(".toolbar-actions");
  const player = document.getElementById("player-bar");
  if (!bar || !player) return;
  player.style.bottom = bar.getBoundingClientRect().height + "px";
}
window.addEventListener("resize", updatePlayerBarPosition);

function closePlayer() {
  const audio = document.getElementById("audio");
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  document.getElementById("player-spectrogram-btn").hidden = true;
  document.getElementById("player-spectrogram").removeAttribute("src");
  currentPlayerDetectionId = null;
  currentClipName = null;
  clearWaveform();
  closeSpectrogramOverlay();
  document.getElementById("player-bar").classList.remove("active");
  document.body.classList.remove("player-active");
  updatePlayerBarPosition();
  document.querySelectorAll("button.play").forEach(b => b.classList.remove("playing"));
  document.getElementById("fx-gain").value = 0;
  document.getElementById("fx-gain-label").textContent = "0dB";
  document.getElementById("fx-highpass").value = "1000";
  document.getElementById("fx-normalize").checked = true;
  document.getElementById("fx-denoise").value = "off";
  if (fxGain) fxGain.gain.value = 1;
  if (fxHighpass) fxHighpass.frequency.value = 1000;
  setNormalize(true);
  playerLocked = false;
  document.querySelectorAll("input.row-select").forEach(cb => { cb.disabled = false; });
  updateSelectionUI(currentVisibleRows());
}

document.getElementById("rows").addEventListener("click", e => {
  const btn = e.target.closest("button.auto-row-btn");
  if (!btn) return;
  submitAutoRow(Number(btn.dataset.id), btn.dataset.verdict, btn);
});

function handlePlayClick(e) {
  const btn = e.target.closest("button.play");
  if (!btn) return;
  document.querySelectorAll("button.play").forEach(b => b.classList.remove("playing"));
  btn.classList.add("playing");
  const audio = document.getElementById("audio");
  currentClipName = btn.dataset.clip;
  audio.src = clipUrlForDenoise(document.getElementById("fx-denoise").value);
  document.getElementById("player-label").textContent = btn.dataset.label;
  currentPlayerDetectionId = btn.dataset.id;
  document.getElementById("player-spectrogram").src = spectrogramUrl(btn.dataset.id, "sm", true);
  document.getElementById("player-spectrogram-btn").hidden = false;
  document.getElementById("player-bar").classList.add("active");
  document.body.classList.add("player-active");
  updatePlayerBarPosition();
  ensureAudioGraph();
  if (audioCtx.state === "suspended") audioCtx.resume();
  audio.play();
  loadWaveform(btn.dataset.id, btn.dataset.begin, btn.dataset.end, btn.dataset.species, btn.dataset.conf);

  const id = Number(btn.dataset.id);
  selectedIds.clear();
  selectedIds.add(id);
  playerLocked = true;
  document.querySelectorAll("input.row-select").forEach(cb => {
    cb.checked = Number(cb.dataset.id) === id;
    cb.disabled = true;
  });
  updateSelectionUI(lastVisibleRows);
}
document.getElementById("rows").addEventListener("click", handlePlayClick);
document.getElementById("locked-rows").addEventListener("click", handlePlayClick);

function toggleXenoCantoPanel(panel, species) {
  const isActive = panel.classList.contains("open") && panel.dataset.activeSpecies === species;
  panel.classList.remove("open");
  panel.innerHTML = "";
  delete panel.dataset.activeSpecies;
  if (isActive) return;
  panel.dataset.activeSpecies = species;
  panel.classList.add("open");
  panel.innerHTML = `<span class="sub">Loading…</span>`;
  fetch("/api/xenocanto?species=" + encodeURIComponent(species))
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        panel.innerHTML = `<span class="sub">xeno-canto: ${data.error}</span>`;
        return;
      }
      if (!data.recordings || data.recordings.length === 0) {
        panel.innerHTML = `<span class="sub">No recordings found.</span>`;
        return;
      }
      panel.innerHTML = data.recordings.slice(0, 3).map(r => `
        <div class="xc-rec">
          <audio controls preload="none" src="${r.file}"></audio>
          <span class="sub">${escapeHtml(r.recordist || "Unknown")} · Q${escapeHtml(r.quality || "?")} · ${escapeHtml(r.country || "")} ·
            <a href="${r.url}" target="_blank" rel="noopener">XC${r.id}</a> ·
            <a href="${r.license}" target="_blank" rel="noopener">license</a>
          </span>
        </div>
      `).join("");
    })
    .catch(err => {
      panel.innerHTML = `<span class="sub">Failed to load: ${err}</span>`;
    });
}

document.getElementById("rows").addEventListener("click", e => {
  const btn = e.target.closest(".xc-toggle");
  if (!btn) return;
  const panel = btn.closest("tr").nextElementSibling.querySelector(".xc-panel");
  toggleXenoCantoPanel(panel, btn.dataset.species);
});

// Locked cards share one .xc-panel per card (see renderLocked) instead of

// (BirdNET/Perch) opens the same panel, matching the table's one-panel-

  const btn = e.target.closest(".xc-toggle");
  if (!btn) return;
  const panel = btn.closest(".locked-card").querySelector(".xc-panel");

document.getElementById("player-false-positive-btn").addEventListener("click", () => submitReview("false_positive", "False Positive"));
document.getElementById("player-lock-btn").addEventListener("click", () => {
  const locking = viewMode !== "locked";
  submitLock(locking, undefined, !locking);
});
document.getElementById("player-close-btn").addEventListener("click", closePlayer);

document.addEventListener("click", e => {
  const bar = document.getElementById("player-bar");
  if (!bar.classList.contains("active")) return;
  if (bar.contains(e.target)) return;
  if (e.target.closest("button.play")) return;
  if (e.target.closest("#spectrogram-overlay")) return;
  closePlayer();
});

Promise.all([loadCandidates(), loadDays(), loadConfig()])
  .then(() => render())
  .catch(err => {
    document.getElementById("subtitle").textContent = "Failed to load: " + err;
  });
</script>
